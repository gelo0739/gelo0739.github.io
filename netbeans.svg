<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer Bezel - Top Left (Green) -->
  <polygon points="100,20 30.72,60 56.70,75 100,50" fill="#A2CA3B" />
  
  <!-- Outer Bezel - Top Right (Lime Green) -->
  <polygon points="100,20 169.28,60 143.30,75 100,50" fill="#9EC335" />
  
  <!-- Outer Bezel - Right Top (Dark Blue) -->
  <polygon points="169.28,60 169.28,140 143.30,125 143.30,75" fill="#1C6BB9" />
  
  <!-- Outer Bezel - Right Bottom (Bright Blue) -->
  <polygon points="169.28,140 100,180 100,150 143.30,125" fill="#2A8EEA" />
  
  <!-- Outer Bezel - Bottom Left (Pink / Magenta) -->
  <polygon points="100,180 30.72,140 56.70,125 100,150" fill="#E92453" />
  
  <!-- Outer Bezel - Left Top (Dark Crimson) -->
  <polygon points="30.72,140 30.72,60 56.70,75 56.70,125" fill="#A10237" />

  <!-- Inner Cube - Top Face (Cream White) -->
  <polygon points="100,50 143.30,75 100,100 56.70,75" fill="#F2F5E8" />
  
  <!-- Inner Cube - Left Face (White) -->
  <polygon points="56.70,75 100,100 100,150 56.70,125" fill="#FFFFFF" />
  
  <!-- Inner Cube - Right Face (Soft Blue-Gray) -->
  <polygon points="100,100 143.30,75 143.30,125 100,150" fill="#CBD9E5" />
</svg>
